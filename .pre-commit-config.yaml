repos:
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
    hooks:
      - id: actionlint
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2 # v1.30.1
    hooks:
      - id: zizmor
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 745eface02aef23e168a8afb6b5737818efbea95 # v0.11.0.1
    hooks:
      - id: shellcheck
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: 479be5958357ba5ab65ce47172117348516860e9 # v3.14.1-1
    hooks:
      - id: shfmt
        args: [-i, "2", -d]
  - repo: local
    hooks:
      - id: oxfmt
        name: oxfmt
        entry: pnpm -s format:check
        language: system
        pass_filenames: false
      - id: oxlint
        name: oxlint
        entry: pnpm -s lint
        language: system
        pass_filenames: false
      - id: tsc
        name: tsc
        entry: pnpm -s typecheck
        language: system
        pass_filenames: false
      - id: vitest
        name: vitest
        entry: pnpm -s test
        language: system
        pass_filenames: false
      - id: ruff-check
        name: ruff check
        entry: uv run --locked ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run --locked ruff format --check
        language: system
        types: [python]
      - id: ty
        name: ty
        entry: uv run --locked ty check
        language: system
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: uv run --locked pytest -q
        language: system
        pass_filenames: false
      - id: snippets
        name: snippets are up to date
        entry: pnpm -s extract-snippets --check
        language: system
        pass_filenames: false
      - id: drift
        name: examples match catalog.json
        entry: pnpm -s check-drift
        language: system
        pass_filenames: false
