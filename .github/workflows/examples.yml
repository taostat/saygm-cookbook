name: examples

on:
  pull_request:
  repository_dispatch:
    types: [catalog-published]
  schedule:
    - cron: "17 6 * * 1"

permissions: {}

concurrency:
  group: examples-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  select:
    name: Select examples
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # diff the pull request against its base
    outputs:
      slugs: ${{ steps.select.outputs.slugs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Select examples
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            slugs=$(git diff --name-only "$BASE_SHA" HEAD | pnpm -s select-examples)
          else
            slugs=$(ls examples)
          fi
          echo "slugs=$(echo "$slugs" | xargs)" >>"$GITHUB_OUTPUT"

  live:
    name: Run examples against SayGM
    needs: select
    # Pull requests from forks get no secrets; their offline checks still run in checks.yml.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read # check out the examples
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.19
          enable-cache: false
      - run: pnpm install --frozen-lockfile
      - run: uv sync --locked --all-packages

      - name: Refresh the catalog
        if: github.event_name != 'pull_request'
        run: pnpm sync-catalog

      - name: Check drift and snippets
        run: |
          pnpm check-drift
          pnpm extract-snippets --check

      - name: Run examples
        if: needs.select.outputs.slugs != ''
        env:
          SAYGM_API_KEY: ${{ secrets.SAYGM_API_KEY }}
          SAYGM_RUN_CAP_USD: "0.50"
          SLUGS: ${{ needs.select.outputs.slugs }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [ -z "$SAYGM_API_KEY" ]; then
            if [ "$PR_AUTHOR" = "dependabot[bot]" ]; then
              echo "::notice::Dependabot pull requests have no SayGM key, so the live run is skipped. The offline checks still run, and the next weekly or catalog run after merge tests the update live."
              exit 0
            fi
            echo "::error::SAYGM_API_KEY is not set for this repository."
            exit 1
          fi
          # shellcheck disable=SC2086 # SLUGS is a space-separated list of example names
          pnpm run-examples --write-status $SLUGS

      - name: Keep the refreshed catalog and status
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified
          path: |
            catalog.json
            snippets/status.json
          retention-days: 7

  shopify-surface:
    name: Check the Shopify UCP surface and pinned profile
    needs: select
    if: >-
      contains(fromJSON('["schedule", "pull_request"]'), github.event_name) &&
      contains(format(' {0} ', needs.select.outputs.slugs), ' shopify-store-assistant ')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # check out the example
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.19
          enable-cache: false
      - name: Compare the store's UCP tools and the pinned profile with the committed code
        working-directory: examples/shopify-store-assistant
        run: uv run --locked check_surface.py

  publish:
    name: Commit the verified dates
    needs: live
    if: always() && github.event_name != 'pull_request' && needs.live.result != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # push catalog.json and snippets/status.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified
      - name: Commit changes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git add catalog.json snippets/status.json
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Record verified examples and refresh the catalog"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:${GITHUB_REF_NAME}"
